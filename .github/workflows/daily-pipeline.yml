name: Daily Finance Channel Pipeline

on:
  schedule:
    # 00:30 UTC = 6:00 AM IST — matches the research/script schedule this
    # replaces. Cron is UTC regardless of where you are; adjust if needed.
    - cron: "30 0 * * *"
  workflow_dispatch:
    # Lets you trigger a run manually from the Actions tab — useful for
    # testing without waiting for the schedule, or re-running a failed day.
    inputs:
      num_videos:
        description: "Number of videos to produce"
        default: "3"
      topic_focus:
        description: "Optional topic focus/steer (leave blank for none)"
        default: ""
      skip_upload:
        description: "Render everything but skip the YouTube upload (dry run)"
        type: boolean
        default: false

permissions:
  contents: write  # needed for the "Publish dashboard data" step to commit docs/dashboard_data.json back to the repo

jobs:
  daily-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 180  # rendering 3 full videos with the retention-feature overlays is not fast — see production-pipeline README's performance note
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick fonts-dejavu fonts-noto
          # Poppins font (used for headlines/thumbnails) isn't in the default repos.
          # assemble_video.py / generate_thumbnail.py hardcode this exact path
          # (FONT_BOLD / FONT_BLACK), so the download destination must match it.
          sudo mkdir -p /usr/share/fonts/truetype/google-fonts
          sudo curl -fsSL -o /usr/share/fonts/truetype/google-fonts/Poppins-Bold.ttf "https://github.com/google/fonts/raw/main/ofl/poppins/Poppins-Bold.ttf"
          fc-cache -f

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Verify font is valid
        # Fail loudly here instead of downstream with an opaque Pillow error
        # if the download didn't actually produce a valid font file. Runs
        # after Python deps so Pillow is actually importable at this point.
        run: python3 -c "from PIL import ImageFont; ImageFont.truetype('/usr/share/fonts/truetype/google-fonts/Poppins-Bold.ttf', 40)" || (echo "::error::Poppins-Bold.ttf failed to download or is invalid" && exit 1)

      - name: Restore YouTube credentials
        if: ${{ !inputs.skip_upload }}
        run: |
          echo "${{ secrets.YOUTUBE_CLIENT_SECRET_B64 }}" | base64 -d > pipeline/client_secret.json
          echo "${{ secrets.YOUTUBE_TOKEN_B64 }}" | base64 -d > pipeline/youtube_token.json

      - name: Update thumbnail style weights from past performance
        # Closes the thumbnail feedback loop: joins docs/thumbnail_style_log.json
        # (which style each past video used) against real CTR from the
        # Analytics API and writes docs/thumbnail_style_weights.json, which
        # generate_thumbnail.py reads below to favor whichever style is
        # actually earning more clicks. continue-on-error because this is
        # a best-effort learning step (e.g. it no-ops gracefully with no
        # performance history yet, or if the analytics scope isn't granted
        # yet) — it must never block today's videos from being produced.
        if: ${{ !inputs.skip_upload }}
        continue-on-error: true
        run: python3 pipeline/analyze_performance.py 90

      - name: Run the daily cycle
        env:
          # Free Gemini API key (aistudio.google.com/apikey, no card needed)
          # — gemini-2.5-flash's Google Search grounding is free up to 500
          # requests/day, which is enormous headroom for one run/day.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Optional repo variable (Settings > Secrets and variables > Actions
          # > Variables) to point research_and_script.py at a different
          # Gemini model. Leave unset to use the gemini-2.5-flash default.
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || '' }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PUBLISH_DELAY_HOURS: ${{ vars.PUBLISH_DELAY_HOURS || '6' }}
          TTS_VOICE: ${{ vars.TTS_VOICE || 'en-US-GuyNeural' }}
          BRAND_HEX: ${{ vars.BRAND_HEX || '1F6FEB' }}
          SKIP_UPLOAD: ${{ inputs.skip_upload && '1' || '' }}
        run: |
          python3 pipeline/daily_cycle.py output "${{ inputs.num_videos || '3' }}" "${{ inputs.topic_focus || '' }}"

      - name: Upload artifacts (always, even on partial failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-output-${{ github.run_id }}
          path: output/
          retention-days: 30

      - name: Publish dashboard + learning data
        # Commits the refreshed docs/dashboard_data.json (written by
        # export_dashboard_data.py inside daily_cycle.py), the thumbnail-
        # learning files (docs/thumbnail_style_log.json, appended to by
        # daily_cycle.py after each successful upload, and
        # docs/thumbnail_style_weights.json, written by the
        # analyze_performance.py step above), and docs/topic_niche_log.json
        # (appended to by research_and_script.py every run, tracking which
        # niche — Fed policy, geopolitics, crypto, etc. — each video
        # covered, so future runs avoid stacking the same niche day after
        # day) back to the repo, so the GitHub Pages dashboard and the next
        # run's topic/thumbnail selection always reflect the latest data
        # without any manual step. Runs even on partial failure — a
        # partially-successful run still has real data worth publishing.
        # Silently no-ops if nothing changed (e.g. a skip_upload dry run,
        # or the very first runs before these files exist yet).
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in docs/dashboard_data.json docs/thumbnail_style_log.json docs/thumbnail_style_weights.json docs/topic_niche_log.json; do
            [ -f "$f" ] && git add "$f"
          done
          if ! git diff --cached --quiet; then
            git commit -m "Update dashboard + learning data [skip ci] ($(date -u +%Y-%m-%d))"
            git push
          else
            echo "No dashboard/thumbnail data changes to publish."
          fi

      # Poppins TTF's actual OFL path can shift; adjust the font-download
      # step above if the release layout changes. If a run ever fails at
      # that curl step, generate_thumbnail.py / assemble_video.py will
      # error clearly on a missing font path — that's the signal to fix.
